[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-compiler"
version = "0.1.0"
description = "A small Pascal-like language that compiles to MIPS-32 assembly."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
keywords = ["compiler", "mips", "assembly", "pascal", "education", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tinycc = "tinycc.cli:main"

[tool.setuptools.packages.find]
include = ["tinycc*"]
